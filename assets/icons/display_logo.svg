<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A34"/>
      <stop offset="100%" stop-color="#33218F"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle radial glow -->
  <circle cx="256" cy="180" r="220" fill="#4C3FCF" opacity="0.18"/>

  <!-- Document / blog page -->
  <g>
    <path d="M156 108 H302 L356 162 V404 A20 20 0 0 1 336 424 H156 A20 20 0 0 1 136 404 V128 A20 20 0 0 1 156 108 Z"
          fill="#F8FAFC"/>
    <!-- folded corner -->
    <path d="M302 108 L356 162 H322 A20 20 0 0 1 302 142 Z" fill="#CBD5E1"/>
  </g>

  <!-- text lines representing blog content -->
  <rect x="172" y="200" width="130" height="14" rx="7" fill="#94A3B8"/>
  <rect x="172" y="230" width="100" height="14" rx="7" fill="#CBD5E1"/>

  <!-- code bracket accent representing "IT" -->
